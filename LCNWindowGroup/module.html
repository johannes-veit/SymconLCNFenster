<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="/icons.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            height: auto;
            overflow: visible;
            background: transparent;
            color: inherit;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; color: inherit; }

        /* Oberer Bereich bewusst ansichtsgleich zu LCN Befehl / Zentral AUS. */
        .root {
            position: relative;
            width: 100%;
            min-height: 280px;
            height: auto;
            padding: 8px 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            overflow: visible;
        }
        .layout {
            width: 100%;
            max-width: 650px;
            height: 250px;
            min-height: 250px;
            flex: 0 0 250px;
            display: grid;
            grid-template-columns: minmax(0, 470px) 86px;
            align-items: center;
            justify-content: center;
            column-gap: 14px;
            margin: 0 auto;
        }
        .dial {
            position: relative;
            grid-column: 1;
            justify-self: stretch;
            width: 100%;
            max-width: 470px;
            height: 250px;
            min-height: 250px;
        }
        .reserved-right {
            grid-column: 2;
            width: 86px;
            height: 50px;
            visibility: hidden;
            pointer-events: none;
        }
        .command {
            position: absolute;
            left: 50%;
            top: 51%;
            transform: translate(-50%, -50%);
            width: 116px;
            height: 116px;
            border: 0;
            border-radius: 58px;
            background: #00c7b0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
        }
        .command:active:not(:disabled) { transform: translate(-50%, -50%) scale(.97); }
        .command:disabled { opacity: .45; cursor: default; }
        .command i { font-size: 54px; }

        .feedback {
            position: absolute;
            left: 50%;
            top: calc(51% + 72px);
            transform: translateX(-50%);
            font-size: 12px;
            line-height: 1.2;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s linear;
        }
        .feedback.visible { opacity: .72; }

        /* Wie bei der Lichtgruppe: normale Dokumenthöhe, kein internes Scrollfenster. */
        .members-wrap {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 0 100px 2px 14px;
            flex: 0 0 auto;
        }
        .members-title {
            margin: 0 0 5px;
            font-size: 11px;
            line-height: 1.2;
            opacity: .52;
        }
        .members {
            position: static;
            width: 100%;
            max-height: none;
            overflow: visible;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px 16px;
            padding: 0;
            font-size: 11.5px;
            line-height: 1.3;
        }
        .member {
            min-width: 0;
            display: grid;
            grid-template-columns: 10px minmax(0, 1fr) auto;
            align-items: start;
            gap: 5px;
        }
        .dot {
            width: 7px;
            height: 7px;
            margin-top: 4px;
            border-radius: 50%;
            background: rgba(127,127,127,.50);
        }
        .member.closed .dot { background: #00c7b0; }
        .member.moving .dot, .member.unknown .dot { background: #d49b21; }
        .member.fault .dot { background: #c45b63; }
        .member-name {
            min-width: 0;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .member-state {
            opacity: .62;
            font-size: 10.5px;
            white-space: nowrap;
        }
        .empty {
            grid-column: 1 / -1;
            opacity: .58;
            font-size: 11.5px;
        }

        @media (max-width: 640px) {
            .root { min-height: 250px; padding: 4px 5px 8px; }
            .layout {
                grid-template-columns: minmax(0, 360px) 66px;
                column-gap: 5px;
                height: 230px;
                min-height: 230px;
                flex-basis: 230px;
            }
            .dial { max-width: 360px; height: 230px; min-height: 230px; }
            .reserved-right { width: 66px; height: 44px; }
            .command { width: 94px; height: 94px; border-radius: 47px; }
            .command i { font-size: 44px; }
            .feedback { top: calc(51% + 59px); font-size: 11px; }
            .members-wrap { padding: 0 76px 2px 9px; }
            .members {
                grid-template-columns: 1fr;
                gap: 3px;
                font-size: 10.8px;
            }
            .member-state { font-size: 10px; }
        }
        @media (max-width: 390px) {
            .layout {
                grid-template-columns: minmax(0, 1fr) 58px;
                column-gap: 2px;
            }
            .dial { min-width: 0; }
            .reserved-right { width: 58px; height: 40px; }
            .command { width: 84px; height: 84px; border-radius: 42px; }
            .command i { font-size: 39px; }
            .feedback { top: calc(51% + 54px); }
            .members-wrap { padding-right: 66px; }
        }
    </style>
</head>
<body>
<div id="root" class="root">
    <div class="layout">
        <div class="dial">
            <button id="commandButton" class="command" type="button" aria-label="Alle Fenster schließen" title="Alle Fenster schließen">
                <i class="fa-light fa-power-off"></i>
            </button>
            <div id="feedback" class="feedback" aria-live="polite">Befehl gesendet</div>
        </div>
        <div class="reserved-right" aria-hidden="true"></div>
    </div>

    <div class="members-wrap">
        <div class="members-title">Fensterstatus</div>
        <div id="members" class="members"></div>
    </div>
</div>
<script>
(function () {
    var state = %%INITIAL_DATA%%;
    var commandButton = document.getElementById('commandButton');
    var members = document.getElementById('members');
    var feedback = document.getElementById('feedback');
    var feedbackTimer = 0;

    function showFeedback() {
        if (feedbackTimer) {
            window.clearTimeout(feedbackTimer);
            feedbackTimer = 0;
        }
        feedback.classList.add('visible');
        feedbackTimer = window.setTimeout(function () {
            feedback.classList.remove('visible');
            feedbackTimer = 0;
        }, 3000);
    }

    function renderMembers(list) {
        while (members.firstChild) {
            members.removeChild(members.firstChild);
        }

        if (!list || !list.length) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'Keine Fenster ausgewählt';
            members.appendChild(empty);
            return;
        }

        for (var i = 0; i < list.length; i++) {
            var item = list[i] || {};
            var row = document.createElement('div');
            var statusClass = String(item.statusClass || 'unknown');
            row.className = 'member ' + statusClass;

            var dot = document.createElement('span');
            dot.className = 'dot';

            var name = document.createElement('span');
            name.className = 'member-name';
            name.textContent = item.name || ('#' + String(item.id || ''));
            name.title = name.textContent;

            var status = document.createElement('span');
            status.className = 'member-state';
            status.textContent = item.statusText || '?';

            row.appendChild(dot);
            row.appendChild(name);
            row.appendChild(status);
            members.appendChild(row);
        }
    }

    function render(next) {
        var key;
        if (next && typeof next === 'object') {
            for (key in next) {
                if (Object.prototype.hasOwnProperty.call(next, key)) {
                    state[key] = next[key];
                }
            }
        }

        /* Eine laufende Sequenz darf den Button optisch nicht ausgrauen. */
        commandButton.disabled = !Boolean(state.configured);
        commandButton.title = state.configured ? 'Alle Fenster schließen' : 'Fensterauswahl prüfen';
        renderMembers(state.members || []);
    }

    function sendCloseAll() {
        if (!state.configured || state.running) { return; }

        /* Sofortige lokale Quittung ohne zusätzliche Symcon-Variable. */
        state.running = true;
        showFeedback();

        if (typeof requestAction === 'function') {
            requestAction('CloseAll', true);
        }
    }

    commandButton.onclick = function (event) {
        if (event) { event.stopPropagation(); }
        sendCloseAll();
    };

    window.__lcnWindowGroupHandleMessage = function (message) {
        var data = message;
        try {
            if (typeof message === 'string') {
                data = JSON.parse(message);
            }
            render(data);
        } catch (e) {
            /* Letzte gültige Darstellung beibehalten. */
        }
    };

    render(state);
}());

function handleMessage(message) {
    if (typeof window.__lcnWindowGroupHandleMessage === 'function') {
        window.__lcnWindowGroupHandleMessage(message);
    }
}
</script>
</body>
</html>
